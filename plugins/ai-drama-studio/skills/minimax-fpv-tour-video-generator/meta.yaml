summary-en: "Turns uploaded characters and environments into first-person FPV tours by confirming duration and ratio, then choosing route geometry that fits the scene."
summary-cn: "先确认时长和画幅，再按场景空间决定路线几何，生成连续沉浸的第一人称 FPV 一镜到底穿越视频。"
desc-en: "This Skill is for users who need a first-person FPV one-take video to showcase an uploaded scene, while optionally using an uploaded character as a visible motion guide. The user can provide a character image, scene image, architecture/interior/landscape reference, or an optional motion reference video. The Skill then analyzes spatial depth, water surfaces, traversable gaps, obstacles, and route flow, chooses route geometry based on the scene, only adds low-water skimming when the scene truly supports it, and plans a one-take route with close passes, banking, dives, gap threading, and strong parallax. It is suitable for scene showcases, tourism/architecture/space promotion, and character-guided flight, but not for talking-head videos, static product ads, generic drone footage, or cut-heavy montage trailers."
desc-cn: "此 Skill 面向需要用第一人称 FPV 一镜到底展示上传场景的用户，同时可让上传角色作为持续可见的飞行动线引导物。用户可以提供角色图、场景图、建筑/室内/景观参考，或额外运镜参考视频；随后分析空间深度、水面、可穿越缝隙、障碍和动线，根据场景决定路线几何，只在场景真的支持时安排贴水掠飞，再规划近距离擦过、侧倾、俯冲、穿缝和强视差的一镜到底路线。适合场景展示、文旅/建筑/空间宣传和角色引导式飞行，不适用于真人口播、静态产品广告、通用航拍素材或频繁切镜的蒙太奇预告片。"
