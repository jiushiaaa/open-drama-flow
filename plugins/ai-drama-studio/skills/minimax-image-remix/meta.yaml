summary-en: "Generate new images with a reference vibe"
summary-cn: "复刻参考图氛围生成新图"
desc-en: "For creators who want new images inspired by a reference without copying its subject. Users provide one or more references, describe the replacement content, choose which visual qualities to preserve, and confirm whether direct reference guidance is authorized. The workflow analyzes ten aesthetic dimensions, condenses them into Form, Aesthetic, and Mood, confirms a remix direction, selects a capability-compatible model, generates independent variants, and iterates on chosen dimensions. It delivers selected images, a reusable prompt, and a concise style summary. It is not for editing the original, exact reproduction, upscaling, format conversion, certain source-model identification, or image-to-video work."
desc-cn: "面向希望借鉴参考图感觉但重新创作内容的用户。用户提供一张或多张参考图、希望替换的新主体，并确认要保留的构图、色彩、光影、质感、媒介或氛围，以及是否有权直接使用参考图。流程先从十个美学维度拆解画面，再归纳为形、韵、意三个轴，确认重混方向，按所需能力选择模型，生成独立变体，并围绕指定维度迭代。最终交付选定图片、可复用提示词和精简风格摘要；不用于修改原图、精确复制、放大转换、确定识别源模型或图片转视频。"
