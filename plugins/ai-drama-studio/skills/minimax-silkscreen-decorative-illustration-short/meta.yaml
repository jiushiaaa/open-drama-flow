summary-en: "Turns a refined silkscreen-decorative illustration theme into a restrained TVC workflow that follows the user's language and adds clean SFX assembly plus an optional same-duration instrumental BGM version."
summary-cn: "将丝印装饰插画主题转成同步音效短片，并可追加同等时长的器乐BGM版，适合奢华叙事广告。"
desc-en: "Creates a refined silkscreen-decorative illustration short with restrained TVC pacing. It confirms the final video spec, analyzes references, designs key elements and paired wide/close shots, generates images and videos, adds synchronized natural sound effects, assembles a clean SFX cut, and optionally mixes a same-duration instrumental BGM version. 旧 MiniMax H3 is the default; a user-selected other model is checked before use."
desc-cn: "本 Skill 面向想制作奢侈品创意广告片质感插画短视频的创作者，强调精细均匀线稿、高密度装饰叙事、冷暖宝石色和平面丝印质感。流程会先确认 Final Video Spec，分析参考图，设计 key element 与固定的全景建立镜头、局部近景跟随镜头，生成元素图和逐镜视频，添加与动作同步的自然音效并完成硬切组接；用户需要时，再生成同等时长的器乐 BGM 版。默认先把旧 旧 H3 意图改写成连续自然语言，再通过审批链调用 Seedance 2.5；用户明确指定其他模型时先检查能力，失败后按原因重试并切换可用模型。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
