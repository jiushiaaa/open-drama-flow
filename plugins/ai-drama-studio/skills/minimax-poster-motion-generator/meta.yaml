summary-en: "Turns uploaded posters into single-take 旧 MiniMax H3 motion posters with ratio mapping, readable text, and timestamped motion prompts."
summary-cn: "将上传海报转为一镜到底动态视频，保留文字清晰、主体关系与最终版式，适合社媒传播。"
desc-en: "Turns an uploaded poster into a polished single-take motion video. The workflow analyzes ratio, layers, typography, anchors, depth, and motion potential, then creates reusable directions, a 2K 8–15-second specification, timestamped prompts, and synchronized sound cues before generation. 旧 MiniMax H3 is the default video model; another model is used only after explicit user selection and capability checking."
desc-cn: "面向已有海报图片、希望生成精致动态海报视频的创作者。Skill 会先分析比例、海报类型、视觉层级、文字版式、锚点、景深和动效潜力，再输出可复用动态方向；上传海报作为最终锁版参考，随后制定 2K、8–15 秒一镜到底规格，编写带时间码的动效提示词与同步音效，并在确认后生成成片。默认先把旧 旧 H3 意图改写成连续自然语言，再通过审批链调用 Seedance 2.5；用户明确指定其他模型时先检查能力再执行，强调文字可读、版式稳定、主体连贯与画面节奏。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
