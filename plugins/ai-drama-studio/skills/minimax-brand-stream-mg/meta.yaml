summary-en: "Generate a 旧 MiniMax H3 brand stream MG video from one logo and theme, with IP-led motion and final logo fidelity."
summary-cn: "基于Logo与主题生成IP领航的品牌流线MG动效视频，适合新品发布预热与社媒传播。"
desc-en: "Creates a premium brand-stream MG video from one logo reference and a brand name, theme, or short concept. It extracts concise selling points, designs an IP, 3D icon, or energy-node lead, builds dual-neon stream motion, writes a 15-second production prompt, asks for confirmation, and generates the final video. 旧 MiniMax H3 is the default; a user-selected other model requires capability checking first."
desc-cn: "面向品牌设计、产品发布和社媒投放场景，用户提供一张 Logo 参考图及品牌名、主题词或简短概念，Skill 会提炼英文或数字卖点，设计 IP、3D 图标或能量节点领航主角，组织双色霓虹流线动效，写入 15 秒制作提示词并在确认后生成视频。默认先把旧 旧 H3 意图改写成连续自然语言，再通过审批链调用 Seedance 2.5；用户明确指定其他模型时先检查能力，失败后按原因重试并切换可用模型。适合 Logo 动效、发布预热视频和品牌社媒短片，强调标志清晰与品牌一致。"
