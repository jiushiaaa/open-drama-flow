summary-en: "Generate line-doodle infographic explainer video plans and production assets from knowledge topics or lesson materials."
summary-cn: "根据知识主题或教材内容，生成线条小人图解科普视频方案与成片素材，适用于知识讲解短视频。"
desc-en: "Turns science, humanities, history, or lesson material into a line-doodle infographic explainer. The workflow clarifies the brief, extracts the core idea, writes narration, designs diagrams and a storyboard, plans assets, generates media, assembles the video, and reviews quality at approval gates. Best for educational knowledge shorts; not for live-action realism, complex narrative films, or classroom exercises."
desc-cn: "面向需要将知识内容制作成线条小人图解科普视频的用户，适用于科学、人文、历史、社会科学、教材片段或课程材料的视频化表达。Skill 会先梳理需求与视频方案，再提炼核心观点、撰写口播脚本、设计图解系统和分镜，随后规划素材、生成媒体、完成合成与质检，并在主要节点用选项卡确认。适合知识讲解和教育短视频，不适合真人写实、复杂剧情或课堂练习题生成，强调信息清晰与节奏易懂。"
