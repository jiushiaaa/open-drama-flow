summary-en: Evaluates video intent and references, turning scattered inputs into controllable multimodal video generation instructions.
summary-cn: 判断视频需求与参考素材，将零散输入整理成可控的多模态视频生成指令。
desc-en: Turns rough video ideas, asset lists, keyframes, multimodal references, and edit instructions into production-ready 旧 MiniMax H3 prompts. It diagnoses the request, checks reference fit, asks focused choice-card questions, and outputs official 旧 H3 structures for reference roles, UI/text control, keyframes, music, dialogue, and edit preservation. It does not replace full scriptwriting, storyboards, long workflows, or prompts for other models.
desc-cn: 这是一个本地 Skill，用于把粗略视频创意、素材列表、关键帧需求、多模态参考和视频编辑指令转成可生产使用的 Seedance 2.5 提示词（从旧 H3 结构迁移）。它会先识别任务类型，评估用户文字和参考图是否满足目标，缺少会改变 prompt 骨架的信息时用选项提问，并在用户选择后只输出官方 旧 H3 格式，如 integrated_multimodal_description 或 subject_definitions 与 retention_analysis。它适合 case 级 旧 H3 提示词、参考素材角色映射、UI/文字/布局控制、关键帧对齐、音乐卡点/对白和编辑保留；不替代完整剧本、分镜规划、长期项目流程或其他视频模型提示词。
author-en: MiniMax Design
author-cn: MiniMax Design
