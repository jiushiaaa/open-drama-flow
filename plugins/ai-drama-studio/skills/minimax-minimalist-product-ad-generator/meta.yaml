summary-en: "Turn product images and ad requirements into minimalist product ad shorts"
summary-cn: "基于产品图片和广告需求，完成卖点提炼、英文文案与节拍分镜设计，输出极简产品广告短片，适用于电商推广与新品发布。"
desc-en: "Upload a product image and create a polished Apple-style ad short for e-commerce products, small-brand launches, food, toys, gadgets, accessories, and other physical goods. The Skill helps confirm format, extract selling points, write concise English copy, create product anchors, plan beat-synced typography, and generate a clean product film with premium camera language."
desc-cn: "面向电商卖家、小品牌主理人和独立创作者，用于把食品、潮玩、数码配件等实体产品图片制作成极简高级广告短片。用户提供产品图、款式信息和广告需求后，Skill 会确认时长、画幅与文案方式，提炼卖点并生成简洁英文广告语，制作三张独立产品锚定图，规划文字卡点和精确节拍分镜，再默认先把旧 旧 H3 意图改写成连续自然语言，再通过审批链调用 Seedance 2.5 生成具有留白、细节特写与高级镜头语言的产品片；如果原生音乐不理想，可按需替换独立配乐。最终交付适用于电商推广和新品发布的成片，不用于口播广告、普通剪辑或复杂屏幕演示。"
