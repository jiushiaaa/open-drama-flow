summary-en: "Create captioned Vox collage science animations with 旧 MiniMax H3 motion."
summary-cn: "根据主题、文章或报告生成带字幕、旁白与背景音乐的拼贴风格科普动画成片。"
desc-en: "Turn a topic, article, or report into a Vox-style explainer video through a short approval-first workflow. The Skill writes a production document for approval, then creates 2.5D mixed-media collage animation with torn-paper texture, framed information labels, shallow parallax, coherent cutout motion, consistent narration voice, segment-matched subtitles, BGM, and final assembly."
desc-cn: "面向需要把知识主题、文章或研究报告转化为解释型视频的创作者。用户提供主题、正文或资料后，Skill 会先梳理观点并生成包含制作方案、脚本、分镜、镜头细节和旁白逐字稿的制作文档，确认后制作主视觉与关键帧，再完成二维半混合媒介拼贴、撕纸质感、信息标签、浅层视差和连贯剪纸动画，并统一口播音色、分段字幕、背景音乐与最终合成。最终交付完整科普动画，适合短纪录片和教育视频论文，不用于虚构长剧情或纯角色动画。"
